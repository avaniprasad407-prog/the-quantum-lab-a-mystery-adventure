  <meta name="description" content="A Quantum Mystery Adventure for Ages 12–15. Discover qubits, superposition, gates, interference, and entanglement through hands-on experimentation." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- SYNTHESIZED AUDIO ENGINE (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }
      getCtx() {
        if (this.isMuted) return null;
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      toggleMute() {
        this.isMuted = !this.isMuted;
        return this.isMuted;
      }
      playClick() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      }
      playGate(type = 'X') {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.type = type === 'H' ? 'triangle' : type === 'Z' ? 'sawtooth' : 'sine';
        const base = type === 'X' ? 520 : type === 'Z' ? 440 : 660;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 1.5, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(base, now + 0.16);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(now + 0.22);
      }
      playMeasure() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
      }
      playUnlock() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }
      playDiscovery() {
        const ctx = this.getCtx();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = ctx.currentTime + idx * 0.08;
          gain.gain.setValueAtTime(0.09, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.32);
        });
      }
      playCoreRestore() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 2.0);
        gain.gain.setValueAtTime(0.02, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 1.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 2.7);
      }
    }
    const soundFx = new SoundEngine();

    // --- QUANTUM ENGINE ---
    function createStateFromAngles(theta, phi) {
      const t = Math.max(0, Math.min(Math.PI, theta));
      const p = ((phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const halfT = t / 2;
      const alpha = { re: Math.cos(halfT), im: 0 };
      const beta = { re: Math.sin(halfT) * Math.cos(p), im: Math.sin(halfT) * Math.sin(p) };
      const x = Math.sin(t) * Math.cos(p);
      const y = Math.sin(t) * Math.sin(p);
      const z = Math.cos(t);
      const prob0 = alpha.re * alpha.re;
      const prob1 = beta.re * beta.re + beta.im * beta.im;
      return { theta: t, phi: p, x, y, z, prob0, prob1 };
    }

    function applySingleGate(state, gate) {
      if (gate === 'X') {
        return createStateFromAngles(Math.PI - state.theta, state.phi);
      } else if (gate === 'Z') {
        return createStateFromAngles(state.theta, state.phi + Math.PI);
      } else if (gate === 'H') {
        if (state.prob0 > 0.95) return createStateFromAngles(Math.PI / 2, 0); // |0> -> |+>
        if (state.prob1 > 0.95) return createStateFromAngles(Math.PI / 2, Math.PI); // |1> -> |->
        if (Math.abs(state.theta - Math.PI / 2) < 0.1 && Math.abs(state.phi) < 0.1) {
          return createStateFromAngles(0, 0); // |+> -> |0>
        }
        if (Math.abs(state.theta - Math.PI / 2) < 0.1 && Math.abs(state.phi - Math.PI) < 0.1) {
          return createStateFromAngles(Math.PI, 0); // |-> -> |1>
        }
        return createStateFromAngles(Math.PI / 2, 0);
      }
      return state;
    }

    function computeTwoQubitState(steps) {
      let c00 = 1, c01 = 0, c10 = 0, c11 = 0;
      const SQRT2 = 1 / Math.SQRT2;

      for (const step of steps) {
        if (step.gateA === 'X') {
          [c00, c10] = [c10, c00];
          [c01, c11] = [c11, c01];
        } else if (step.gateA === 'Z') {
          c10 = -c10;
          c11 = -c11;
        } else if (step.gateA === 'H') {
          const n00 = (c00 + c10) * SQRT2;
          const n10 = (c00 - c10) * SQRT2;
          const n01 = (c01 + c11) * SQRT2;
          const n11 = (c01 - c11) * SQRT2;
          c00 = n00; c10 = n10; c01 = n01; c11 = n11;
        }

        if (step.gateB === 'X') {
          [c00, c01] = [c01, c00];
          [c10, c11] = [c11, c10];
        } else if (step.gateB === 'Z') {
          c01 = -c01;
          c11 = -c11;
        } else if (step.gateB === 'H') {
          const n00 = (c00 + c01) * SQRT2;
          const n01 = (c00 - c01) * SQRT2;
          const n10 = (c10 + c11) * SQRT2;
          const n11 = (c10 - c11) * SQRT2;
          c00 = n00; c01 = n01; c10 = n10; c11 = n11;
        }

        if (step.isCNOT_AtoB) {
          [c10, c11] = [c11, c10];
        }
      }

      const p00 = c00 * c00;
      const p01 = c01 * c01;
      const p10 = c10 * c10;
      const p11 = c11 * c11;
      return { prob00: p00, prob01: p01, prob10: p10, prob11: p11 };
    }

    const ALL_DISCOVERIES = [
      { id: 'qubit', title: 'The Qubit', tagline: 'Basic unit of quantum information', text: 'Unlike classical bits that are strictly 0 or 1, a qubit exists in a continuous state until measured.', formula: '|ψ⟩ = α|0⟩ + β|1⟩' },
      { id: 'bloch_sphere', title: 'The Bloch Sphere', tagline: 'Geometric map of a single qubit state', text: 'Top pole is |0⟩, bottom is |1⟩, equator holds superpositions. It is a visual representation, not physical space.', formula: '|ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩' },
      { id: 'measurement', title: 'Quantum Measurement', tagline: 'Observation forces an outcome', text: 'The same preparation can produce different measurement outcomes according to probabilities determined by state.', formula: 'P(|0⟩) = |α|², P(|1⟩) = |β|²' },
      { id: 'superposition', title: 'Superposition', tagline: 'Linear combination of states', text: 'A qubit is not hidden in a secret 0 or 1 before measurement; it explores multiple states simultaneously.', formula: '|+⟩ = (|0⟩ + |1⟩)/√2' },
      { id: 'x_gate', title: 'The X Gate (Bit Flip)', tagline: 'Flips |0⟩ and |1⟩', text: 'The quantum NOT gate. Rotates the state vector by 180° around the X-axis of the Bloch sphere.', formula: 'X|0⟩ = |1⟩, X|1⟩ = |0⟩' },
      { id: 'h_gate', title: 'The H Gate (Hadamard)', tagline: 'Gateway to superposition', text: 'Transforms |0⟩ or |1⟩ into an equal 50/50 superposition state on the sphere equator.', formula: 'H|0⟩ = ( |0⟩ + |1⟩ ) / √2' },
      { id: 'z_gate', title: 'The Z Gate (Phase Flip)', tagline: 'Flips phase without changing 0/1 probabilities', text: 'Leaves |0⟩ untouched but inverts |1⟩ to -|1⟩. Invisible in simple 0/1 measurements, but detected via interference!', formula: 'Z|0⟩ = |0⟩, Z|1⟩ = -|1⟩' },
      { id: 'interference', title: 'Quantum Interference', tagline: 'Amplitudes cancel or reinforce', text: 'Quantum probability amplitudes can have signs that cancel out destructively or add constructively.', formula: 'H·Z·H|0⟩ = |1⟩ (Phase interference)' },
      { id: 'cnot_gate', title: 'The CNOT Gate', tagline: 'Conditional control between two qubits', text: 'If the Control Qubit is |1⟩, the Target Qubit is flipped. If the Control is |0⟩, the Target is unchanged.', formula: 'CNOT|c, t⟩ = |c, c ⊕ t⟩' },
      { id: 'entanglement', title: 'Quantum Entanglement', tagline: 'Inseparable quantum correlation', text: 'Applying H on A then CNOT creates (|00⟩+|11⟩)/√2. Measuring reveals 00 and 11, with 01 and 10 never appearing!', formula: '|Φ⁺⟩ = (|00⟩ + |11⟩) / √2' },
    ];

    // --- BLOCH SPHERE COMPONENT ---
    function BlochSphereCanvas({ state, size = 300 }) {
      const canvasRef = useRef(null);
      const [rotX, setRotX] = useState(0.35);
      const [rotY, setRotY] = useState(-0.65);
      const isDraggingRef = useRef(false);
      const lastPosRef = useRef({ x: 0, y: 0 });

      const project = (x, y, z, radius, cx, cy) => {
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const x1 = x * cosY - y * sinY;
        const y1 = x * sinY + y * cosY;
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const z2 = y1 * sinX + z * cosX;
        const px = cx + x1 * radius;
        const py = cy - z2 * radius;
        return { px, py };
      };

      const draw = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        const r = Math.min(w, h) * 0.36;
        const cx = w / 2, cy = h / 2;

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, r * 1.3);
        glow.addColorStop(0, 'rgba(6, 182, 212, 0.08)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        for (let t = 0; t <= Math.PI * 2; t += 0.08) {
          const pt = project(Math.cos(t), Math.sin(t), 0, r, cx, cy);
          if (t === 0) ctx.moveTo(pt.px, pt.py); else ctx.lineTo(pt.px, pt.py);
        }
        ctx.stroke();

        const origin = project(0, 0, 0, r, cx, cy);
        const zEnd = project(0, 0, 1.3, r, cx, cy);
        ctx.beginPath();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;
        ctx.moveTo(origin.px, origin.py);
        ctx.lineTo(zEnd.px, zEnd.py);
        ctx.stroke();
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('+Z', zEnd.px + 4, zEnd.py);

        const p0 = project(0, 0, 1, r, cx, cy);
        const p1 = project(0, 0, -1, r, cx, cy);
        ctx.fillStyle = '#10b981';
        ctx.fillText('|0⟩ (Top)', p0.px - 22, p0.py - 8);
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('|1⟩ (Bottom)', p1.px - 28, p1.py + 18);

        const tip = project(state.x, state.y, state.z, r, cx, cy);
        const grad = ctx.createLinearGradient(origin.px, origin.py, tip.px, tip.py);
        grad.addColorStop(0, '#06b6d4');
        grad.addColorStop(1, '#f43f5e');
        ctx.beginPath();
        ctx.strokeStyle = grad;
        ctx.lineWidth = 3.5;
        ctx.moveTo(origin.px, origin.py);
        ctx.lineTo(tip.px, tip.py);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(tip.px, tip.py, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#f43f5e';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('|ψ⟩', tip.px + 8, tip.py - 4);

        ctx.restore();
      }, [state, rotX, rotY]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size}px`;
        draw();
      }, [size, draw]);

      const onPointerDown = (e) => {
        isDraggingRef.current = true;
        lastPosRef.current = { x: e.clientX, y: e.clientY };
      };
      const onPointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - lastPosRef.current.x;
        const dy = e.clientY - lastPosRef.current.y;
        lastPosRef.current = { x: e.clientX, y: e.clientY };
        setRotY(p => p + dx * 0.01);
        setRotX(p => Math.max(-1.4, Math.min(1.4, p + dy * 0.01)));
      };
      const onPointerUp = () => { isDraggingRef.current = false; };

      return (
        <div className="flex flex-col items-center">
          <canvas
            ref={canvasRef}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            className="cursor-grab active:cursor-grabbing rounded-2xl touch-none"
          />
          <div className="text-[11px] text-slate-400 font-mono mt-1">
            Drag to rotate 3D view · |0⟩ Top / |1⟩ Bottom
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentScene, setCurrentScene] = useState(1);
      const [gameMode, setGameMode] = useState('explorer');
      const [isMuted, setIsMuted] = useState(false);
      const [unlocked, setUnlocked] = useState([]);
      const [isNotebookOpen, setIsNotebookOpen] = useState(false);
      const [isMatrixOpen, setIsMatrixOpen] = useState(false);

      const [qubitState, setQubitState] = useState(createStateFromAngles(0, 0));
      const [measureCounts, setMeasureCounts] = useState({ '0': 0, '1': 0, total: 0 });
      const [circuitSteps, setCircuitSteps] = useState([]);
      const [twoQubitCounts, setTwoQubitCounts] = useState(null);

      const [coreStage, setCoreStage] = useState(1);
      const [isCoreRestored, setIsCoreRestored] = useState(false);

      const unlock = (id) => {
        if (!unlocked.includes(id)) {
          soundFx.playDiscovery();
          setUnlocked(prev => [...prev, id]);
        }
      };

      const handleMeasureSingle = () => {
        soundFx.playMeasure();
        const outcome = Math.random() < qubitState.prob0 ? '0' : '1';
        setMeasureCounts(prev => ({
          ...prev,
          [outcome]: prev[outcome] + 1,
          total: prev.total + 1
        }));
        if (currentScene === 3 && Math.abs(qubitState.prob0 - 0.5) < 0.1) {
          unlock('measurement');
          unlock('superposition');
        }
      };

      const handleMeasureBatch = (shots) => {
        soundFx.playMeasure();
        let c0 = 0;
        for (let i = 0; i < shots; i++) {
          if (Math.random() < qubitState.prob0) c0++;
        }
        const c1 = shots - c0;
        setMeasureCounts(prev => ({
          '0': prev['0'] + c0,
          '1': prev['1'] + c1,
          total: prev.total + shots
        }));
        if (currentScene === 3) {
          unlock('measurement');
          unlock('superposition');
        }
      };

      const applyGate = (gate) => {
        soundFx.playGate(gate);
        const next = applySingleGate(qubitState, gate);
        setQubitState(next);

        if (currentScene === 4 && next.prob1 > 0.95) {
          soundFx.playUnlock();
          unlock('x_gate');
        }
        if (currentScene === 5 && Math.abs(next.prob0 - 0.5) < 0.1) {
          unlock('h_gate');
        }
      };

      const twoQubitState = computeTwoQubitState(circuitSteps);

      const runTwoQubitExperiment = (shots = 20) => {
        soundFx.playMeasure();
        const counts = { '00': 0, '01': 0, '10': 0, '11': 0 };
        for (let i = 0; i < shots; i++) {
          const r = Math.random();
          if (r < twoQubitState.prob00) counts['00']++;
          else if (r < twoQubitState.prob00 + twoQubitState.prob01) counts['01']++;
          else if (r < twoQubitState.prob00 + twoQubitState.prob01 + twoQubitState.prob10) counts['10']++;
          else counts['11']++;
        }
        setTwoQubitCounts(counts);

        if (currentScene === 8 && circuitSteps.some(s => s.isCNOT_AtoB)) {
          unlock('cnot_gate');
        }
        if (currentScene === 9 && circuitSteps.some(s => s.gateA === 'H') && circuitSteps.some(s => s.isCNOT_AtoB)) {
          unlock('entanglement');
        }

        if (currentScene === 10) {
          let pass = false;
          if (coreStage === 1 && twoQubitState.prob10 > 0.95) pass = true;
          if (coreStage === 2 && Math.abs(twoQubitState.prob00 - 0.5) < 0.08 && Math.abs(twoQubitState.prob01 - 0.5) < 0.08) pass = true;
          if (coreStage === 3 && Math.abs(twoQubitState.prob00 - 0.5) < 0.08 && Math.abs(twoQubitState.prob11 - 0.5) < 0.08 && twoQubitState.prob01 < 0.02) pass = true;

          if (pass) {
            soundFx.playUnlock();
            if (coreStage < 3) {
              setCoreStage(s => s + 1);
              setCircuitSteps([]);
            } else {
              soundFx.playCoreRestore();
              setIsCoreRestored(true);
            }
          }
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Top Bar */}
          <header className="sticky top-0 z-40 bg-slate-950/90 border-b border-slate-800 px-6 py-3.5 backdrop-blur-md">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <a href="#" onClick={() => setCurrentScene(1)} className="text-lg font-bold tracking-tight text-slate-100 hover:text-cyan-400">
                The Quantum Lab
              </a>

              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
                <button onClick={() => setCurrentScene(1)} className={`hover:text-slate-100 ${currentScene !== 11 ? 'text-cyan-400 font-semibold' : ''}`}>
                  Adventure
                </button>
                <button onClick={() => setIsNotebookOpen(true)} className="hover:text-slate-100">
                  Notebook ({unlocked.length}/{ALL_DISCOVERIES.length})
                </button>
                <button onClick={() => setIsMatrixOpen(true)} className="hover:text-slate-100">
                  Matrix Lab

                </div>

                    </button>
                    <button
                      onClick={() => { setQubitState(createStateFromAngles(Math.PI, 0)); unlock('bloch_sphere'); }}

                    </button>
                    <button
                      onClick={() => setQubitState(createStateFromAngles(Math.PI / 2, 0))}

                    </button>

            {currentScene === 3 && (

                      onClick={() => {
                        const s = applySingleGate(applySingleGate(createStateFromAngles(0,0), 'H'), 'H');

                        setQubitState(s3);
                        unlock('z_gate');

                  <div className="text-purple-400">Path 1 Amplitude with Z: -1/2</div>
                  <div className="text-slate-300 font-bold border-t border-slate-800 pt-2">

                </div>

                </button>

            {currentScene === 9 && (

                </div>
                <button onClick={() => runTwoQubitExperiment(50)} className="px-5 py-2.5 bg-cyan-600 rounded-xl text-xs font-mono font-bold">
                  Run 50 Shots
                </button>
                {twoQubitCounts && (
                  <div className="grid grid-cols-4 gap-2 text-center font-mono text-xs">
                    {['00', '01', '10', '11'].map(k => (
                      <div key={k} className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                        <div className="text-slate-400">|{k}⟩</div>
                        <div className="text-base font-bold text-slate-100">{twoQubitCounts[k]}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* NOTEBOOK MODAL */}
          {isNotebookOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold">The Quantum Notebook</h3>
                  <button onClick={() => setIsNotebookOpen(false)} className="text-slate-400 hover:text-white font-mono text-sm">Close ✕</button>
                </div>
                <div className="space-y-3">
                  {ALL_DISCOVERIES.map(d => (
                    <div key={d.id} className="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-1">
                      <div className="font-bold text-cyan-400 text-sm">{d.title}</div>
                      <div className="text-xs text-slate-300">{d.text}</div>
                      <div className="font-mono text-[11px] text-purple-300">{d.formula}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MATRIX LAB MODAL */}
          {isMatrixOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold">The Matrix Lab (Scientist Mode)</h3>
                  <button onClick={() => setIsMatrixOpen(false)} className="text-slate-400 hover:text-white font-mono text-sm">Close ✕</button>
                </div>
                <div className="font-mono text-xs space-y-3 text-slate-300">
                  <div className="p-3 bg-slate-950 rounded-xl">
                    <div className="text-cyan-400 font-bold mb-1">Pauli-X Gate:</div>
                    [ 0  1 ] [ 1 ] = [ 0 ]  (Flips |0⟩ to |1⟩)<br/>
                    [ 1  0 ] [ 0 ]   [ 1 ]
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl">
                    <div className="text-purple-400 font-bold mb-1">Pauli-Z Gate:</div>
                    [ 1   0 ] [ 0 ] = [  0 ]  (Flips phase of |1⟩)<br/>
                    [ 0  -1 ] [ 1 ]   [ -1 ]
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl">
                    <div className="text-emerald-400 font-bold mb-1">Hadamard Gate:</div>
                    1/√2 [ 1   1 ] [ 1 ] = 1/√2 [ 1 ]  (Creates superposition |+⟩)<br/>
                         [ 1  -1 ] [ 0 ]        [ 1 ]
                  </div>
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 p-4 text-center text-xs text-slate-400">
            The Quantum Lab · Goal → Experiment → Apply Gate → Measure → Discover Rule
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
